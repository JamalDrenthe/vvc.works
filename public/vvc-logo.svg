<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="vvc-badge-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="75%" stop-color="#08080a" />
      <stop offset="100%" stop-color="#020202" />
    </radialGradient>
    <filter id="vvc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#e6007e" flood-opacity="0.5" />
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&amp;display=swap');
      .vvc-lettermark {
        font-family: 'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-style: italic;
        letter-spacing: -0.05em;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>

  <!-- Buitenste cirkelrand in VVC Magenta met subtiele gloed -->
  <circle cx="256" cy="256" r="236" fill="url(#vvc-badge-bg)" stroke="#e6007e" stroke-width="18" filter="url(#vvc-glow)" />

  <!-- VVC. Merknaam -->
  <text x="246" y="258" class="vvc-lettermark" font-size="142" fill="#ffffff">
    VVC<tspan fill="#e6007e" font-style="normal">.</tspan>
  </text>
</svg>
