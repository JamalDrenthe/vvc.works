name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master
      - 'feat/**'
      - 'fix/**'
      - 'security/**'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Validate Git ref & commit metadata safely
        id: meta
        env:
          RAW_BRANCH: ${{ github.ref_name }}
          RAW_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$RAW_BRANCH" =~ ^[A-Za-z0-9._/-]{1,120}$ ]] || [[ "$RAW_BRANCH" == -* ]]; then
            echo "::error::Invalid or unsafe branch name rejected."
            exit 1
          fi
          if [[ ! "$RAW_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid commit SHA rejected."
            exit 1
          fi
          echo "branch=$RAW_BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$RAW_SHA" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      # master -> production (login.verdienendevrienden.club via vvc-login); feature branches -> preview URL
      - name: Deploy to Cloudflare Pages (vvc-login)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=vvc-login --branch=${{ steps.meta.outputs.branch }} --commit-hash=${{ steps.meta.outputs.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
